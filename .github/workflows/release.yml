# Builds DepthKey.app and a DMG on a macOS runner.
#   Push a tag like v0.0.1  -> publishes a GitHub Release with DepthKey-0.0.1.dmg
#   Run it by hand          -> builds only, the DMG is kept as a workflow artifact
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' mac/project.yml)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app and DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mac/build.sh dmg
          mv mac/build/DepthKey.dmg "mac/build/DepthKey-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: DepthKey-${{ steps.version.outputs.version }}
          path: mac/build/DepthKey-${{ steps.version.outputs.version }}.dmg

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "mac/build/DepthKey-$VERSION.dmg" \
            --title "DepthKey $VERSION" --notes-file - <<'EOF'
          Webcam background removal by **depth**, for Apple silicon Macs (macOS 15+).

          **Install**
          1. Install [OBS 30+](https://obsproject.com) and start its Virtual Camera once (DepthKey sends its video there).
          2. Open the DMG and drag DepthKey to Applications.
          3. DepthKey is not notarized: the first time, go to System Settings › Privacy & Security and click **Open Anyway**.
          4. Allow the camera. The models (~150 MB) download on first start.

          Then pick **OBS Virtual Camera** in Zoom, Meet, Slack or Teams.

          See the [Mac README](https://github.com/elalemanyo/depthkey/tree/main/mac) for everything else.
          The Depth Pro 2 weights are Apple's, licensed for non-commercial research use only.
          EOF
