<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depthkey</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f2; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --line: #dcdcd6; --accent: #2f6fde; --check-a: #e6e6e1; --check-b: #f7f7f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1f1f1d; --text: #ececE8; --muted: #9a9a93;
      --line: #34342f; --accent: #6b9cff; --check-a: #2a2a27; --check-b: #222220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px;
    padding: 16px; min-height: 100vh; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .stage { display: grid; place-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 300px; }
  #out { max-width: 100%; max-height: calc(100vh - 34px); display: block;
    background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 24px 24px; }
  #out.mirror { transform: scaleX(-1); }
  .stage p { color: var(--muted); padding: 24px; text-align: center; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; gap: 14px; align-self: start; }
  h1 { font-size: 16px; margin: 0; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  label > span { display: flex; justify-content: space-between; }
  label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; align-items: center; }
  .check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, button, input[type=color] { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button { cursor: pointer; }
  .stats { font: 12px/1.6 ui-monospace, monospace; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="stage">
    <canvas id="out" class="hidden mirror"></canvas>
    <p id="hint">Press <b>Start camera</b>. Depth Pro 2 runs on the server; the page keeps
      everything nearer than the cut-off distance.</p>
  </div>

  <aside>
    <h1>depthkey</h1>
    <div class="row">
      <button id="start" class="primary">Start camera</button>
      <select id="camera" class="hidden" aria-label="Camera"></select>
    </div>

    <label>
      <span>Cut-off distance <b id="thrVal"></b></span>
      <input id="thr" type="range" min="0.3" max="5" step="0.05" value="1.4">
    </label>
    <button id="auto">Auto: subject in the center + 40 cm</button>

    <label>
      <span>Edge softness <b id="softVal"></b></span>
      <input id="soft" type="range" min="0.01" max="0.5" step="0.01" value="0.12">
    </label>

    <label>Background
      <select id="bgMode">
        <option value="blur">Blur</option>
        <option value="color">Color (chroma key for OBS)</option>
        <option value="image">Image…</option>
        <option value="none">Transparent</option>
        <option value="depth">Show depth map</option>
      </select>
    </label>
    <div class="row">
      <input id="bgColor" type="color" value="#00b140" class="hidden" aria-label="Background color">
      <input id="bgFile" type="file" accept="image/*" class="hidden">
    </div>

    <label>Model input width (smaller = faster)
      <select id="inWidth">
        <option>256</option><option selected>320</option><option>384</option>
        <option>512</option><option>640</option>
      </select>
    </label>

    <label class="check"><input id="aligned" type="checkbox" checked>
      Show the processed frame (mask lines up, lower fps)</label>
    <label class="check"><input id="mirror" type="checkbox" checked> Mirror</label>

    <div class="stats" id="stats">not connected</div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const out = $("out"), octx = out.getContext("2d");
const fg = document.createElement("canvas"), fctx = fg.getContext("2d");
const small = document.createElement("canvas"), sctx = small.getContext("2d", { willReadFrequently: true });
const mask = document.createElement("canvas"), mctx = mask.getContext("2d");
const video = document.createElement("video");
video.muted = true; video.playsInline = true;

let ws, inFlight = false, sentAt = 0, pendingFrame = null, shownFrame = null;
let depth = null, dw = 0, dh = 0, bgImage = null, autoOnce = true;
let stats = { ms: 0, rtt: 0, f: 0, n: 0, t0: performance.now(), fps: 0 };

// ---- controls -------------------------------------------------------------
const thr = $("thr"), soft = $("soft");
function showValues() {
  $("thrVal").textContent = (+thr.value).toFixed(2) + " m";
  $("softVal").textContent = Math.round(soft.value * 100) + " cm";
}
thr.oninput = soft.oninput = () => { showValues(); buildMask(); };
showValues();
$("mirror").onchange = (e) => out.classList.toggle("mirror", e.target.checked);
$("bgMode").onchange = (e) => {
  $("bgColor").classList.toggle("hidden", e.target.value !== "color");
  $("bgFile").classList.toggle("hidden", e.target.value !== "image");
  if (e.target.value === "image" && !bgImage) $("bgFile").click();
  buildMask();
};
$("bgFile").onchange = async (e) => {
  const file = e.target.files[0];
  if (file) bgImage = await createImageBitmap(file);
};
$("inWidth").onchange = () => { if (ws?.readyState === 1) ws.send("reset"); };
$("auto").onclick = autoThreshold;

// ---- camera ---------------------------------------------------------------
async function startCamera(deviceId) {
  video.srcObject?.getTracks().forEach((t) => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, ...(deviceId && { deviceId: { exact: deviceId } }) },
  });
  video.srcObject = stream;
  await video.play();
  out.width = fg.width = video.videoWidth;
  out.height = fg.height = video.videoHeight;
  out.classList.remove("hidden"); $("hint").classList.add("hidden");
  $("start").textContent = "Restart";

  const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  const sel = $("camera");
  sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || "Camera " + (i + 1)}</option>`).join("");
  sel.value = stream.getVideoTracks()[0].getSettings().deviceId;
  sel.classList.toggle("hidden", cams.length < 2);
  sel.onchange = () => startCamera(sel.value);

  autoOnce = true;
  if (ws?.readyState === 1) ws.send("reset");
  connect();
}
$("start").onclick = () => startCamera().catch((e) => {
  $("hint").textContent = "Camera error: " + e.message +
    (window.isSecureContext ? "" : " (the camera needs https or localhost)");
});

// ---- server ---------------------------------------------------------------
function connect() {
  if (ws && ws.readyState <= 1) return;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { inFlight = false; sendFrame(); };
  ws.onclose = () => { $("stats").textContent = "disconnected, retrying…"; setTimeout(connect, 1000); };
  ws.onmessage = (e) => {
    const view = new DataView(e.data);
    dw = view.getUint16(0, true); dh = view.getUint16(2, true);
    stats.ms = view.getFloat32(4, true); stats.f = view.getFloat32(8, true);
    depth = new Uint16Array(e.data, 12, dw * dh);
    stats.rtt = performance.now() - sentAt;
    stats.n++;
    shownFrame?.close?.();
    shownFrame = pendingFrame; pendingFrame = null;
    if (autoOnce) { autoOnce = false; autoThreshold(); }
    buildMask();
    inFlight = false;
    sendFrame();
  };
}

async function sendFrame() {
  if (inFlight || ws?.readyState !== 1 || video.readyState < 2) return;
  inFlight = true;
  const w = +$("inWidth").value;
  const h = Math.round((w * video.videoHeight) / video.videoWidth / 2) * 2;
  if (small.width !== w || small.height !== h) { small.width = w; small.height = h; }
  sctx.drawImage(video, 0, 0, w, h);
  pendingFrame = await createImageBitmap(video);  // full-res copy of exactly this frame
  small.toBlob((blob) => { sentAt = performance.now(); ws.send(blob); }, "image/jpeg", 0.85);
}

// ---- mask -----------------------------------------------------------------
function autoThreshold() {
  if (!depth) return;
  const vals = [];
  for (let y = Math.floor(dh * 0.3); y < dh * 0.7; y += 2)
    for (let x = Math.floor(dw * 0.35); x < dw * 0.65; x += 2) {
      const d = depth[y * dw + x];
      if (d > 0 && d < 65535) vals.push(d);
    }
  if (!vals.length) return;
  vals.sort((a, b) => a - b);
  thr.value = Math.min(5, vals[vals.length >> 1] / 1000 + 0.4);
  showValues(); buildMask();
}

function buildMask() {
  if (!depth) return;
  if (mask.width !== dw || mask.height !== dh) { mask.width = dw; mask.height = dh; }
  const img = mctx.createImageData(dw, dh), px = img.data;
  const showDepth = $("bgMode").value === "depth";
  const t = thr.value * 1000, s = Math.max(1, soft.value * 1000), lo = Math.log(300), hi = Math.log(6000);
  for (let i = 0; i < depth.length; i++) {
    const d = depth[i], j = i * 4;
    if (showDepth) {  // near = bright warm, far = dark blue; log scale 0.3–6 m
      const v = d ? 1 - Math.min(1, Math.max(0, (Math.log(d) - lo) / (hi - lo))) : 0;
      px[j] = 255 * v; px[j + 1] = 180 * v * v; px[j + 2] = 80 + 120 * (1 - v); px[j + 3] = 255;
    } else {
      const a = d === 0 ? 0 : (t + s / 2 - d) / s;
      px[j + 3] = 255 * Math.min(1, Math.max(0, a));
    }
  }
  mctx.putImageData(img, 0, 0);
}

// ---- render ---------------------------------------------------------------
function cover(ctx, src, W, H) {
  const r = Math.max(W / src.width, H / src.height), w = src.width * r, h = src.height * r;
  ctx.drawImage(src, (W - w) / 2, (H - h) / 2, w, h);
}

function render() {
  requestAnimationFrame(render);
  const frame = $("aligned").checked ? shownFrame : video;
  if (!frame || !depth || !out.width) return;
  const W = out.width, H = out.height, mode = $("bgMode").value;
  octx.imageSmoothingEnabled = fctx.imageSmoothingEnabled = true;

  if (mode === "depth") { octx.clearRect(0, 0, W, H); octx.drawImage(mask, 0, 0, W, H); return; }

  octx.clearRect(0, 0, W, H);
  if (mode === "blur") {
    octx.filter = "blur(18px)"; octx.drawImage(frame, 0, 0, W, H); octx.filter = "none";
  } else if (mode === "color") {
    octx.fillStyle = $("bgColor").value; octx.fillRect(0, 0, W, H);
  } else if (mode === "image" && bgImage) {
    cover(octx, bgImage, W, H);
  }

  fctx.globalCompositeOperation = "copy";
  fctx.drawImage(frame, 0, 0, W, H);
  fctx.globalCompositeOperation = "destination-in";
  fctx.filter = "blur(2px)";          // smooths the upscaled mask edge
  fctx.drawImage(mask, 0, 0, W, H);
  fctx.filter = "none";
  fctx.globalCompositeOperation = "source-over";
  octx.drawImage(fg, 0, 0);
}
requestAnimationFrame(render);

setInterval(() => {
  const now = performance.now();
  stats.fps = (stats.n * 1000) / (now - stats.t0); stats.n = 0; stats.t0 = now;
  if (ws?.readyState === 1 && depth)
    $("stats").innerHTML =
      `depth fps   ${stats.fps.toFixed(1)}<br>model       ${stats.ms.toFixed(0)} ms<br>` +
      `round trip  ${stats.rtt.toFixed(0)} ms<br>depth size  ${dw}×${dh}<br>` +
      `focal       ${stats.f ? stats.f.toFixed(0) + " px" : "–"}`;
}, 1000);
</script>
</body>
</html>
